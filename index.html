<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Não Monogâmico</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #111111;
            color: white;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 850px;
            padding: 40px 20px;
        }

        /* LOGO */
        .logo {
            width: min(600px, 90%);
            height: auto;
            margin-bottom: 30px;
        }

        /* TÍTULO */
        h1 {
            font-size: 46px;
            line-height: 1.2;
            margin-bottom: 10px;
        }

        /* BONECO */
        .mascot {
            width: 220px;
            height: auto;
            display: block;
            margin: 10px auto 25px;
            border-radius: 10px;
        }

        /* TEXTO */
        p {
            font-size: 20px;
            line-height: 1.6;
            color: #cccccc;
            margin: 0 auto 35px;
            max-width: 750px;
        }

        /* BOTÃO */
        .coming-soon {
            display: inline-block;
            padding: 15px 32px;
            border: 1px solid white;
            border-radius: 30px;
            font-size: 16px;
            letter-spacing: 2px;
        }

        /* RODAPÉ */
        .footer {
            margin-top: 60px;
            font-size: 14px;
            color: #777777;
        }

        /* CELULAR */
        @media (max-width: 600px) {

            .container {
                width: 95%;
                padding: 30px 15px;
            }

            .logo {
                width: 95%;
                margin-bottom: 25px;
            }

            h1 {
                font-size: 32px;
                line-height: 1.2;
                margin-bottom: 5px;
            }

            .mascot {
                width: 180px;
                margin: 10px auto 25px;
            }

            p {
                font-size: 17px;
                line-height: 1.6;
            }

            .coming-soon {
                padding: 15px 32px;
            }

            .footer {
                margin-top: 50px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LOGO -->
        <img
            src="logo-nao-monogamico.png"
            alt="Não Monogâmico"
            class="logo"
        >

        <!-- TÍTULO -->
        <h1>
            Em Breve Estaremos no Ar!
        </h1>

        <!-- BONECO CONSTRUINDO O SITE -->
        <img
            src="boneco site construcao.png"
            alt="Mascote construindo o site Não Monogâmico"
            class="mascot"
        >

        <!-- TEXTO -->
        <p>
            Um novo espaço para conversar, aprender e refletir
            sobre relacionamentos, liberdade e novas formas de amar.
        </p>

        <!-- BOTÃO -->
        <div class="coming-soon">
            EM BREVE
        </div>

        <!-- RODAPÉ -->
        <div class="footer">
            © 2026 Não Monogâmico
        </div>

    </div>

</body>
</html>
