<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Não Monogâmico</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #111111;
            color: white;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 850px;
            padding: 40px 20px;
        }

        .logo {
            width: min(600px, 90%);
            height: auto;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 46px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
            color: #cccccc;
            margin: 0 auto 35px;
            max-width: 750px;
        }

        .coming-soon {
            display: inline-block;
            padding: 15px 32px;
            border: 1px solid white;
            border-radius: 30px;
            font-size: 16px;
            letter-spacing: 2px;
        }

        .footer {
            margin-top: 60px;
            font-size: 14px;
            color: #777777;
        }

        @media (max-width: 600px) {
            .logo {
                width: 95%;
            }

            h1 {
                font-size: 32px;
            }

            p {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <img
            src="logo-nao-monogamico.png"
            alt="Não Monogâmico"
            class="logo"
        >

        <h1>
            Em Breve Estaremos no Ar!
        </h1>

        <p>
            Um novo espaço para conversar, aprender e refletir
            sobre relacionamentos, liberdade e novas formas de amar.
        </p>

        <div class="coming-soon">
            EM BREVE
        </div>

        <div class="footer">
            © 2026 Não Monogâmico
        </div>

    </div>

</body>
</html>
