<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Não Monogâmico</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #111111;
            color: white;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 30px;
        }

        .heart {
            font-size: 70px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
            color: #cccccc;
            margin-bottom: 35px;
        }

        .coming-soon {
            display: inline-block;
            padding: 15px 30px;
            border: 1px solid white;
            border-radius: 30px;
            font-size: 16px;
            letter-spacing: 2px;
        }

        .footer {
            margin-top: 60px;
            font-size: 14px;
            color: #777777;
        }

        @media (max-width: 600px) {
            .logo {
                font-size: 30px;
            }

            h1 {
                font-size: 34px;
            }

            p {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            NÃO MONOGÂMICO
        </div>

        <div class="heart">
            ♡
        </div>

        <h1>
            Em Breve Estaremos no Ar!
        </h1>

        <p>
            Um novo espaço para conversar, aprender e refletir
            sobre relacionamentos, liberdade e novas formas de amar.
        </p>

        <div class="coming-soon">
            EM BREVE
        </div>

        <div class="footer">
            © 2026 Não Monogâmico
        </div>

    </div>

</body>
</html>
